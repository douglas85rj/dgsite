name: Deploy Docusaurus to GitHub Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Install dependencies
        run: npm ci
      - name: Build site
        env:
          DOCUSAURUS_CONF_URL: https://douglas85rj.github.io
          DOCUSAURUS_BASE_URL: /dgsite/
        run: npm run build
      - name: Serve build (smoke test)
        run: |
          npm run serve -- --port 3000 --host 127.0.0.1 > /tmp/docusaurus-serve.log 2>&1 &
          SERVER_PID=$!
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:3000/dgsite/ > /dev/null; then
              kill "$SERVER_PID"
              wait "$SERVER_PID" || true
              exit 0
            fi
            sleep 1
          done
          cat /tmp/docusaurus-serve.log
          kill "$SERVER_PID" || true
          wait "$SERVER_PID" || true
          exit 1
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./build

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
